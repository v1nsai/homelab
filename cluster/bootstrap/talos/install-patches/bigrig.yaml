machine:
  install:
    disk: /dev/nvme0n1
    wipe: true
    # iscsi-tools util-linux-tools nonfree-kmod-nvidia-lts nvidia-container-toolkit-lts included in image
    image: factory.talos.dev/installer/fb73a1920c434ba8ec579d24f15097f18ffb171342b1c61f68c063d1b2b601c2:v1.9.4
  network:
    hostname: bigrig
    interfaces:
      - interface: enp10s0
        dhcp: false
        addresses:
          - 192.168.1.154/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
        vip:
          ip: 192.168.1.133
  kubelet:
    extraMounts:
      - destination: /var/mnt/disk0
        type: bind
        source: /var/mnt/disk0
        options:
          - bind
          - rshared
          - rw
  disks:
    - device: /dev/sdb
      partitions:
        - mountpoint: /var/mnt/disk0
  sysctls:
    vm.max_map_count: 262144
cluster:
  allowSchedulingOnControlPlanes: true
