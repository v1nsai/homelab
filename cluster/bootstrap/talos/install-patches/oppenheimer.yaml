machine:
  install:
    # disk: /dev/sdb
    diskSelector:
      wwid: naa.5002538700000000
    wipe: true
    # iscsi-tools util-linux-tools nonfree-kmod-nvidia nvidia-container-toolkit included in image
    image: factory.talos.dev/metal-installer/613e1592b2da41ae5e265e8789429f22e121aab91cb4deb6bc3c0b6262961245:v1.10.6
  network:
    hostname: oppenheimer
    interfaces:
      - interface: eno1
        dhcp: false
        addresses:
          - 192.168.1.152/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
        vip: 
          ip: 192.168.1.133
  kubelet:
    extraMounts:
      - destination: /var/mnt/disk0
        type: bind
        source: /var/mnt/disk0
        options:
          - bind
          - rshared
          - rw
  sysctls:
    vm.max_map_count: 262144
cluster:
  allowSchedulingOnControlPlanes: true
