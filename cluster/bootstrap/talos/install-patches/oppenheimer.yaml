machine:
  install:
    # disk: /dev/sda
    diskSelector:
      wwid: naa.5002538d00000000
    wipe: true
    # iscsi-tools util-linux-tools nonfree-kmod-nvidia nvidia-container-toolkit included in image
    image: factory.talos.dev/installer/88d1f7a5c4f1d3aba7df787c448c1d3d008ed29cfb34af53fa0df4336a56040b:v1.9.4
  network:
    hostname: oppenheimer
    interfaces:
      - interface: eno1
        dhcp: true
        vip: 
          ip: 192.168.1.133
  kubelet:
    extraMounts:
      - destination: /var/mnt/disk0
        type: bind
        source: /var/mnt/disk0
        options:
          - bind
          - rshared
          - rw
  disks:
    - device: /dev/sda
      partitions:
        - mountpoint: /var/mnt/disk0
cluster:
  allowSchedulingOnControlPlanes: true