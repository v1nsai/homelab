machine:
  install:
    disk: /dev/nvme0n1
    wipe: true
    # iscsi-tools util-linux-tools included in image
    image: factory.talos.dev/installer/613e1592b2da41ae5e265e8789429f22e121aab91cb4deb6bc3c0b6262961245:v1.9.4
  network:
    hostname: tiffrig
    interfaces:
      - interface: enp10s0
        dhcp: false
        addresses:
          - 192.168.1.161/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
        vip: 
          ip: 192.168.1.133
  kubelet:
    extraMounts:
      - destination: /var/mnt/disk0
        type: bind
        source: /var/mnt/disk0
        options:
          - bind
          - rshared
          - rw
  disks:
    - device: /dev/sda
      partitions:
        - mountpoint: /var/mnt/disk0
  sysctls:
    vm.max_map_count: 262144
cluster:
  allowSchedulingOnControlPlanes: true