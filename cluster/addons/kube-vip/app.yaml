---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-vip
  namespace: kube-vip
spec:
  targetNamespace: kube-vip
  interval: 1h0m0s
  path: ./cluster/addons/kube-vip/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
    namespace: flux-system