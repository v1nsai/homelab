---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opensearch
spec:
  chart:
    spec:
      chart: opensearch
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: opensearch
  interval: 10m0s
  targetNamespace: opensearch
  values:
    clusterName: "opensearch-homelab-cluster"
    service:
      type: LoadBalancer
    envFrom:
      - secretRef:
          name: opensearch-auth