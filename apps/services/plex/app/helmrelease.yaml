---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
spec:
  chart:
    spec:
      chart: plex-media-server
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: plex
  interval: 1m0s
  values:
    # pms:
    #   resources:
    #     limits:
    #       nvidia.com/gpu: 1
    extraVolumeMounts:
      - name: irma
        mountPath: /irma
    extraVolumes:
      - name: irma
        hostPath:
          path: /var/mnt/irma/media
    extraEnv:
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,video,utility"

    service:
      type: LoadBalancer