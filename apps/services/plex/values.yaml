extraVolumeMounts:
  - name: cronenberg
    mountPath: /downloads
extraVolumes:
  - name: cronenberg
    nfs:
      server: 192.168.1.182
      path: /mnt/cronenberg
# extraEnv:
#   NVIDIA_VISIBLE_DEVICES: "all"
#   NVIDIA_DRIVER_CAPABILITIES: "all"
image:
  pullPolicy: Always
service:
  type: LoadBalancer
pms:
  gpu:
    nvidia:
      enabled: true