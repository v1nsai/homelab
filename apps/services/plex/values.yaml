# pms:
#   resources:
#     limits:
#       nvidia.com/gpu: 1
extraVolumeMounts:
  - name: irma
    mountPath: /irma
extraVolumes:
  - name: irma
    hostPath:
      path: /var/mnt/irma/media
extraEnv:
  NVIDIA_VISIBLE_DEVICES: "all"
  NVIDIA_DRIVER_CAPABILITIES: "compute,video,utility"
image:
  pullPolicy: Always
service:
  type: LoadBalancer