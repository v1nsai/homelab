apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
spec:
  type: LoadBalancer
  ports:
    - name: "9091"
      port: 9091
      targetPort: 9091
  selector:
    app: torrents
---
apiVersion: v1
kind: Service
metadata:
  name: stremio-service
  namespace: default
spec:
  selector:
    app: torrents
  ports:
    - name: http
      port: 8080
  type: ClusterIP