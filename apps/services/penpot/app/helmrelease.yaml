---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: penpot
  namespace: flux-system
spec:
  chart:
    spec:
      chart: penpot
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: penpot
  interval: 1m0s
  targetNamespace: penpot
  values:
    global:
      postgresqlEnabled: true
      redisEnabled: true
    persistence:
      assets:
        enabled: true