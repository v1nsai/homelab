apiVersion: apps/v1
kind: Deployment
metadata:
  name: devbox
  labels:
    app: devbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devbox
  template:
    metadata:
      labels:
        app: devbox
    spec:
      nodeSelector:
        kubernetes.io/hostname: bigrig
      containers:
      - name: devbox
        image: ubuntu:24.04
        # image: docker:dind
        securityContext:
          privileged: true
        env:
          - name: USERNAME
            valueFrom:
              secretKeyRef:
                name: ssh-pubkey
                key: username
        ports:
          - containerPort: 22
        command: ["/bin/bash"]
        args: 
          - -c
          - |
            set -x
            bash /postinstall.sh || echo "Install failed: $?"
            sleep infinity        
        volumeMounts:
          - mountPath: /home
            name: home
          - mountPath: /root/.ssh/authorized_keys
            name: ssh-pubkey
            subPath: authorized_keys
            readOnly: true
          - mountPath: /postinstall.sh
            name: postinstall
            subPath: postinstall.sh
            readOnly: true

      volumes:
      - name: home
        persistentVolumeClaim:
          claimName: devbox-home
      - name: ssh-pubkey
        secret:
          secretName: ssh-pubkey
          items:
            - key: authorized_keys
              path: authorized_keys
      - name: postinstall
        configMap:
          name: postinstall
          items:
            - key: postinstall.sh
              path: postinstall.sh