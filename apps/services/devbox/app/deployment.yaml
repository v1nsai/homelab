apiVersion: apps/v1
kind: Deployment
metadata:
  name: devbox
  labels:
    app: devbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devbox
  template:
    metadata:
      labels:
        app: devbox
    spec:
      nodeSelector:
        kubernetes.io/hostname: bigrig
      containers:
      - name: devbox
        image: ubuntu:24.04
        # image: docker:dind
        # securityContext:
        #   privileged: true
        # lifecycle:
        #   postStart:
        #     exec:
        #       command: ["/bin/bash", "-c", "/postinstall.sh"]
        environment:
          - name: USERNAME
            valueFrom:
              secretKeyRef:
                name: ssh-pubkey
                key: username
        ports:
          - containerPort: 22
        command: ["/bin/bash"]
        args: 
          - -c
          - |
            set -x
            bash /postinstall.sh || echo "Install failed: $?"
            sleep infinity        
        volumeMounts:
        - mountPath: /
          name: home
        - mountPath: /
          name: authorized_keys
          readOnly: true
        - mountPath: /
          name: postinstall
          readOnly: true
      volumes:
      - name: home
        persistentVolumeClaim:
          claimName: devbox-home
      - name: authorized_keys
        secret:
          secretName: ssh-pubkey
          secretKey: authorized_keys
      - name: postinstall
        configMap:
          name: postinstall
          items:
            - key: postinstall.sh
              path: postinstall.sh
