---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opensearch
  namespace: flux-system
spec:
  chart:
    spec:
      chart: opensearch
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: opensearch
  interval: 10m0s
  targetNamespace: opensearch
  values:
    clusterName: "opensearch-homelab-cluster"
    service:
      type: LoadBalancer
    basicAuth:
      enabled: true
      existingSecret: opensearch-auth
    extraEnvs:
      - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: opensearch-auth
            key: password