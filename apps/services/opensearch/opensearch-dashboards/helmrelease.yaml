---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opensearch-dashboards
  namespace: flux-system
spec:
  chart:
    spec:
      chart: opensearch
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: opensearch
  interval: 10m0s
  targetNamespace: opensearch
  values:
    service:
      type: LoadBalancer
